# Keep in sync with vscode/package.json `version` - both clients ship against
# the same codegraph-server protocol surface.
pluginVersion=0.19.1

# Target platform. 243 = 2024.3, the oldest build LSP4IJ 0.20.x supports that
# also has a stable Code Vision API. Bumping this is a compatibility decision,
# not a convenience one.
platformType=IC
platformVersion=2024.3.5
pluginSinceBuild=243

lsp4ijVersion=0.20.1

# The IDE bundles its own Kotlin stdlib; shipping a second copy in the plugin
# jar is the classic source of NoSuchMethodError at runtime.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.configuration-cache=false
