[package]
name = "codegraph-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CodeGraph MCP/LSP server — cross-language code intelligence"

[[bin]]
name = "codegraph-server"
path = "src/main.rs"

[lib]
name = "codegraph_server"
path = "src/lib.rs"

[dependencies]
# LSP framework
tower-lsp.workspace = true
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Utilities
thiserror.workspace = true
# System memory introspection for the embedding-load RAM gate (OOM avoidance)
sysinfo = "0.30"
dashmap.workspace = true
notify.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
lru.workspace = true
regex.workspace = true
globset.workspace = true

# CodeGraph ecosystem
codegraph.workspace = true
codegraph-parser-api.workspace = true
codegraph-python.workspace = true
codegraph-rust.workspace = true
codegraph-typescript.workspace = true
codegraph-go.workspace = true
codegraph-c.workspace = true
codegraph-java.workspace = true
codegraph-cpp.workspace = true
codegraph-kotlin.workspace = true
codegraph-csharp.workspace = true
codegraph-php.workspace = true
codegraph-ruby.workspace = true
codegraph-swift.workspace = true
codegraph-tcl.workspace = true
codegraph-verilog.workspace = true
# Heavy, zero-telemetry-usage grammars — gated behind `extra-languages`
# (default-off) to keep the community binary lean. COBOL's parser.c alone is
# 30.7 MB; none of these appear in any indexed workspace (PostHog, 90d).
codegraph-cobol = { workspace = true, optional = true }
codegraph-fortran = { workspace = true, optional = true }
codegraph-dart = { workspace = true, optional = true }
codegraph-zig = { workspace = true, optional = true }
codegraph-lua.workspace = true
codegraph-groovy.workspace = true
codegraph-r = { workspace = true, optional = true }
codegraph-scala.workspace = true
codegraph-bash.workspace = true
codegraph-elixir.workspace = true
codegraph-haskell.workspace = true
codegraph-hcl.workspace = true
codegraph-julia.workspace = true
codegraph-ocaml.workspace = true
codegraph-perl = { workspace = true, optional = true }
codegraph-toml.workspace = true
codegraph-yaml.workspace = true
codegraph-clojure.workspace = true
codegraph-css.workspace = true
codegraph-elm.workspace = true
codegraph-erlang.workspace = true
codegraph-objc.workspace = true
codegraph-solidity.workspace = true
codegraph-dockerfile.workspace = true

# Memory layer
codegraph-memory.workspace = true

# CLI
clap.workspace = true

[features]
# Off by default → the community binary omits these heavy, unused grammars.
# Pro / full builds opt in with `--features extra-languages`.
extra-languages = [
    "dep:codegraph-cobol",
    "dep:codegraph-fortran",
    "dep:codegraph-dart",
    "dep:codegraph-zig",
    "dep:codegraph-r",
    "dep:codegraph-perl",
]

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
